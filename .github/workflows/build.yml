name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: swift test
      - name: Build app
        run: ./scripts/build_app.sh
      - name: Verify package
        run: unzip -t "outputs/Boosteroid-Presence-macOS.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: Boosteroid-Presence-macOS
          path: outputs/Boosteroid-Presence-macOS.zip
